name: Build Windows alpha installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify lossless Python transport
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify encrypted transfer protocol
        run: dotnet run --project tests/ProtocolTests/ProtocolTests.csproj -c Release
      - name: Install installer compiler
        run: choco install innosetup --yes --no-progress
      - name: Build self-contained installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Python python -CompilerJobs 2 `
            -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Verify install, uninstall and runtime without Python
        shell: pwsh
        run: |
          ./scripts/test-installer.ps1
          python scripts/test-compiled-collector.py "$env:LOCALAPPDATA\Programs\MochiLog Windows\Collector\pymobiledevice3.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MochiLog-Windows-Alpha-Setup
          path: Build/MochiLog-Windows-Alpha-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Collector-compilation-report
          path: Build/Nuitka/compilation-report.xml
          if-no-files-found: ignore
          retention-days: 14
