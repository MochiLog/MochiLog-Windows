name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold_compile:
        description: Measure a full build with Nuitka caches disabled
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/Build/CompilerCache
      MOCHILOG_COLLECTOR_COLD_BUILD: ${{ inputs.cold_compile && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@v4
        if: ${{ !inputs.cold_compile }}
        with:
          path: Build/CompilerCache
          # Cache entries are immutable. Save the refreshed compiler outputs on
          # every successful run instead of repeatedly restoring a stale exact hit.
          key: collector-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('requirements-build.txt', '*.py', 'scripts/compile-collector.py', 'scripts/collector.nuitka-package.config.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            collector-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('requirements-build.txt', '*.py', 'scripts/compile-collector.py', 'scripts/collector.nuitka-package.config.yml') }}-
            collector-${{ runner.os }}-${{ runner.arch }}-py313-
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select compiler parallelism from runner resources
        run: python scripts/compiler-resources.py --github-env
      - name: Verify lossless Python transport
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify encrypted transfer protocol
        run: dotnet run --project tests/ProtocolTests/ProtocolTests.csproj -c Release
      - name: Verify complete support export
        run: dotnet run --project tests/SupportExportTests/SupportExportTests.csproj -c Release
      - name: Install installer compiler
        run: choco install innosetup --yes --no-progress
      - name: Build self-contained installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Python python -CompilerJobs $env:MOCHILOG_COMPILER_JOBS `
            -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Verify install, uninstall and runtime without Python
        shell: pwsh
        run: |
          ./scripts/test-installer.ps1
          python scripts/test-compiled-collector.py "$env:LOCALAPPDATA\Programs\MochiLog Windows\Collector\pymobiledevice3.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MochiLog-Windows-Setup
          path: Build/MochiLog-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Collector-compilation-report
          path: |
            Build/Nuitka/compilation-report.xml
            Build/compiler-resources.json
            Build/collector-build-metrics.json
          if-no-files-found: ignore
          retention-days: 14
